<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Media Controls · Demo</title><link rel="stylesheet" href="/demo/style.css"><main><small>RYOSUKE YAMADA / OPEN COMPONENTS</small><h1>Web Media Controls</h1><p class="lead">映像の演出にも、止まる条件を。利用者の設定と画面の状態に合わせます。</p><section><h2>合成したテスト映像</h2><video id="video" muted loop playsinline preload="none" aria-label="動作確認用のカラーパターン"></video><button id="pause">一時停止</button><button id="resume">再開</button><label><input id="reduce" type="checkbox">動きを減らす設定を模擬する</label><label><input id="save" type="checkbox">Save-Dataを模擬する</label><p>実際のブラウザ設定も反映します。チェックボックスはデモ内の模擬設定です。</p><pre id="state" aria-live="polite"></pre></section><section><h2>スクロールして画面外へ</h2><p>動画が画面外に出ると停止します。タブが非表示になった場合も停止します。</p><div style="height:65vh"></div></section><footer>架空データを使ったローカルデモ。外部API・アクセス解析なし。<br><a href="https://github.com/YAMADA-Ryosuke-0114/web-media-controls">ソースと利用条件</a></footer></main><script type="module">import {createMediaController} from '/src/index.js';
const q=id=>document.querySelector('#'+id),real=matchMedia('(prefers-reduced-motion: reduce)'),reduced=new EventTarget(),connection=new EventTarget();
Object.defineProperty(reduced,'matches',{get:()=>real.matches||q('reduce').checked});Object.defineProperty(connection,'saveData',{get:()=>Boolean(navigator.connection?.saveData||q('save').checked)});
const controller=createMediaController(q('video'),{src:'/demo/sample.mp4',environment:{document,matchMedia:()=>reduced,connection,IntersectionObserver}});
q('pause').onclick=()=>controller.pause();q('resume').onclick=()=>controller.resume();q('reduce').onchange=()=>reduced.dispatchEvent(new Event('change'));q('save').onchange=()=>connection.dispatchEvent(new Event('change'));real.addEventListener('change',()=>reduced.dispatchEvent(new Event('change')));navigator.connection?.addEventListener('change',()=>connection.dispatchEvent(new Event('change')));
setInterval(()=>q('state').textContent=JSON.stringify({...controller.getState(),paused:q('video').paused,sourceLoaded:q('video').hasAttribute('src')},null,2),200);</script></html>
